name: Gerar APK Porteiro Facil

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        run: |
          test -f PorteiroFacil-build-source.zip
          rm -rf build-source
          mkdir build-source
          unzip -q PorteiroFacil-build-source.zip -d build-source
          test -f build-source/PorteiroFacil_Corrigido/settings.gradle.kts
          test -f build-source/PorteiroFacil_Corrigido/app/build.gradle.kts

      - name: Compilar APK debug
        run: |
          cd build-source/PorteiroFacil_Corrigido
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK
        run: |
          cp build-source/PorteiroFacil_Corrigido/app/build/outputs/apk/debug/app-debug.apk PorteiroFacil-debug.apk
          test -f PorteiroFacil-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PorteiroFacil-APK
          path: PorteiroFacil-debug.apk
          if-no-files-found: error
          retention-days: 30
